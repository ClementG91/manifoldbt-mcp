[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "manifoldbt-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server for the manifoldbt backtesting engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ClementG91" },
]
keywords = [
    "manifoldbt",
    "backtesting",
    "trading",
    "quantitative-finance",
    "mcp",
    "model-context-protocol",
    "llm",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "manifoldbt>=0.13",
    "mcp>=1.2",
]

[project.optional-dependencies]
# manifoldbt 0.12.0 replaced the matplotlib tearsheet with plotly, so the
# plotting stack has to come from manifoldbt's own extra: pulling matplotlib
# here left plot_tearsheet without plotly and it failed on import.
plot = ["manifoldbt[plot]>=0.13"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "manifoldbt[plot]>=0.13",
]

[project.scripts]
manifoldbt-mcp = "manifoldbt_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ClementG91/manifoldbt-mcp"
Documentation = "https://github.com/ClementG91/manifoldbt-mcp#readme"
Upstream = "https://github.com/Jimmy7892/manifoldbt"
Issues = "https://github.com/ClementG91/manifoldbt-mcp/issues"
Changelog = "https://github.com/ClementG91/manifoldbt-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/manifoldbt_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]
ignore = ["E501"]
